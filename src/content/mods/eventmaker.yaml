name: EventMaker
tagline: Invisible triggers for packs — datapack command polls, shared IDs, creative-only visibility.
description: >-
  Event Maker is an event-authoring toolkit for modpacks and adventure maps. Build invisible trigger networks, bind
  them to command polls, and execute effects at the player or at dedicated world locations.


  Markers are invisible and untargetable in Survival. Creative builders still get colored wireframe overlays.
  Range-scoped instances let you reuse the same IDs in nearby rooms without cross-triggering.
category: packs
accent: '#2dd4bf'
