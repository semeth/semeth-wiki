name: Leylines
tagline: A Leyline school for Iron’s Spellbooks — night pillars, rift waves, and a violet crystal that builds your kit.
description: >-
  Leylines adds the Leyline school to Iron’s Spells ’n Spellbooks on NeoForge 1.21.1. You need Iron’s, GeckoLib, and
  TerraBlender. The first useful find is a Charge Leyline scroll — it shows up in chests and on Iron’s mobs. At night,
  a violet Leyline Pillar can appear nearby. Walk over, cast Charge Leyline three times, and a Leyline Rift tears open.


  Clear the waves without wandering more than sixty blocks out. Finish the encounter for theme loot, XP, and a 25%
  shot at a Ley Crystal. That crystal crafts the Leyline Codex (10-slot spellbook, +10% ley power, +200 mana) and the
  Ley Staff (+15% ley power, +100 mana, +5% spell power). Miss the drop and buy one from a Nightborn Elf for 12 Ancient
  Mana — they sell at night in the Crimson Thicket, where Ancient Mana Cluster ore grows under Scarlet Aspen.


  The school itself is portals, blinks, time stops, and Leyline Charges: Beam, Ley Blast, Eclipse, and Fissure build a
  five-charge HUD, then Discharge, Ley Blast, and Ley Resonance spend it. Fifteen spells total, same Iron’s scroll and
  book rules as every other school.
