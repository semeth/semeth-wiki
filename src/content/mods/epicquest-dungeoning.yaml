name: EpicQuest Dungeoning
tagline: Author jigsaw dungeon packs, key a portal, and send players into a generated instance that wipes on extract.
description: >-
  EpicQuest Dungeoning lets pack authors register dungeon packs in config and open them through keyed portals.
  Layouts generate in a shared void dimension when a keystone is activated, then wipe on extract until the next
  activation.


  Pair it with EventMaker to drop invisible triggers inside jigsaw pieces — doors, corridors, boss rooms, loot
  gates, and cutscenes — then call the dungeon completion API when a trigger should extract the party.
category: packs
accent: '#e07a3d'
