name: EpicQuest Dungeoning
tagline: Author jigsaw dungeon packs, key a portal, and send players into a generated instance that wipes on extract.
description: >-
  EpicQuest Dungeoning turns authored structure pieces into keyed dungeon runs. Players attune a key, open a
  keystone portal, and enter a procedural jigsaw layout in a shared void dimension. A 10-second group extract
  returns the party and wipes the instance until the next activation.


  Pack authors ship pieces, template pools, and completion rules in config. v3.0.0 adds Dungeon Event Markers:
  place them in Creative, replace them on generate, and fire datapack dungeon_event / event_poll command sets
  when a player walks near. EventMaker is still useful for pack-wide triggers outside a dungeon instance.
category: packs
