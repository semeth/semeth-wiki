name: Spell Codex
tagline: Discover Iron’s spells into a Codex, unlock tiers with ink and XP, then cast only from Spell Actionbar.
description: >-
  Spell Codex replaces Iron’s scroll-and-wheel casting with a progression Codex.
  You discover spells from Codex Pages, leftover scrolls, or by sneak-right-clicking a filled spellbook. Discovery
  grants tier I for free. Higher tiers cost Iron’s ink of the matching rarity plus XP. Equip unlocked spells on
  Spell Actionbar and cast from there only — the wheel, inventory scrolls, and books will not fire.


  Craft an Empty Codex Page at an Arcane Anvil (paper + ink), imprint it at a Scroll Forge while holding a school
  focus (costs 10 levels of XP and consumes the focus), then right-click the finished Codex Page to learn the spell.
  School addons such as Leylines show up as extra tabs. Ars Nouveau needs the separate Spell Codex Ars Compat addon.


  Requires Iron’s Spells ’n Spellbooks and Spell Actionbar 1.1.7+. Pack authors control costs, blacklists, and
  default bar slots under config/specs_irons_spellbooks/.
