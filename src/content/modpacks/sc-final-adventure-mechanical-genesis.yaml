name: SC Final Adventure - Mechanical Genesis
tagline: Feeling lonely as the only soul in the world. Time to craft some friends.
description: >-
  Mechanical Genesis is a Forge 1.20.1 Create-centered pack: you are the world’s only inhabitant until you engineer
  life, materials, and the path forward. Progression meets innovation — build assembly lines, explore expanded biomes
  and dimensions, and follow a questline that shows what is craftable without dumping every recipe on you.


  Harness intricate machinery to craft everything from basic ingredients to rare materials — even life itself. Live
  comfortably with backpacks, organized storage, and tooltips, then work toward an endgame you have to discover
  rather than be handed. You will need a lot of assembly lines.
